# XcodeGen spec — generates Biyaherong.xcodeproj (a real iOS/iPadOS app) that links
# the BiyaherongUI package library (UI + engine + bundled resources).
#
# Usage (from this ios/ folder):
#   brew install xcodegen        # one time
#   xcodegen generate
#   open Biyaherong.xcodeproj
#
# Then set your Signing Team in the target's "Signing & Capabilities" tab and press Run.
# See BUILD-iOS.md for the full walkthrough and how to get it onto other phones.

name: Biyaherong
options:
  bundleIdPrefix: com.biyaherong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BiyaherongUI:
    path: ../DemoApp        # the Swift package whose product is "BiyaherongUI"

targets:
  Biyaherong:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: BiyaherongUI
        product: BiyaherongUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biyaherong.coach   # must be unique — change if App Store rejects it
        PRODUCT_NAME: Biyaherong
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"                     # 1 = iPhone, 2 = iPad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Biyaherong
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: ABCDE12345   # optional: put your 10-char Team ID here to skip the Xcode UI step

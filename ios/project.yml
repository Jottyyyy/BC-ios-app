# XcodeGen spec — generates Biyaherong.xcodeproj (a real iOS/iPadOS app) that links
# the BiyaherongUI package library (UI + engine + bundled resources).
#
# Usage (from this ios/ folder):
#   brew install xcodegen        # one time
#   xcodegen generate
#   open Biyaherong.xcodeproj
#
# Then set your Signing Team in the target's "Signing & Capabilities" tab and press Run.
# See BUILD-iOS.md for the full walkthrough and how to get it onto other phones.

name: Biyaherong
options:
  bundleIdPrefix: com.biyaherong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BiyaherongUI:
    path: ../DemoApp        # the Swift package whose product is "BiyaherongUI"

targets:
  Biyaherong:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      # Not compiled — the local StoreKit configuration the Debug scheme runs against, so the
      # trial, a renewal, an expiry, billing retry and the grace window are all exercisable
      # without App Store Connect. See docs/subscription.md.
      - path: Biyaherong.storekit
        buildPhase: none
      # Also not compiled — Sign in with Apple's entitlement, applied at SIGNING time via
      # CODE_SIGN_ENTITLEMENTS below. It lives out here rather than under App/ because everything
      # in App/ is swept into the target, and an entitlements plist does not belong in the bundle.
      - path: Biyaherong.entitlements
        buildPhase: none
    dependencies:
      - package: BiyaherongUI
        product: BiyaherongUI
    settings:
      base:
        # MUST match the existing App Store Connect record exactly (Apple ID 6762338466,
        # "Biyaherong Chess Coach", team Deniel Causo). This is the bundle ID the earlier
        # Expo/React-Native build shipped under, so uploading with it updates that app
        # instead of silently creating a second one. Do not "tidy" this string.
        # EMPTY on purpose, and this is the app's TEST behaviour: the sign-in opens the session
        # directly and the subscription is granted, so any build anybody makes — CI, Xcode, a
        # sideload — can actually be opened and used.
        #
        # `BIYA_APPSTORE` turns the real Sign in with Apple and real StoreKit back on, and ONLY
        # codemagic.yaml's `ios-appstore` sets it, by rewriting this line before `xcodegen
        # generate` — the same mechanism it already uses for CURRENT_PROJECT_VERSION, because
        # passing a build setting through the Codemagic CLI is not reliable and silently failing
        # to arrive is what cost three test cycles.
        #
        # Do not put BIYA_APPSTORE here by hand. That would make every build a submission build,
        # and the whole point of the default is that a tester never depends on plumbing.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.prince24pogi.biyaherongchessapp
        PRODUCT_NAME: Biyaherong
        # This app ships into the EXISTING "Biyaherong Chess Coach" App Store Connect record,
        # replacing the earlier Expo/React-Native build. App Store Connect refuses any version
        # at or below one it already has. That record reached 1.0.4, then 1.0.5 consumed builds
        # 38-42 — hence 1.0.6, which is the first version to carry a REAL Sign in with Apple
        # (builds 38-42 all shipped the simulated button, which is why they never needed the
        # com.apple.developer.applesignin entitlement and this one does).
        MARKETING_VERSION: "1.0.6"
        # Build number, unique per version string. Version 1.0.4 already reached build 37 in
        # App Store Connect, so continuing at 38 keeps the sequence monotonic across the whole
        # app and avoids any "build already exists" ambiguity. Bump this for each manual upload;
        # CI overwrites it with $BUILD_NUMBER (see codemagic.yaml).
        #
        # KEEP THIS IN SYNC WITH WHAT WAS ACTUALLY DELIVERED. Builds 38-42 are consumed in App
        # Store Connect, all under 1.0.5; 42 shipped 2026-08-17. 43 is the first build of 1.0.6
        # and has NOT been delivered yet. The number keeps climbing across version trains rather
        # than resetting to 1, which is what the paragraph above means by monotonic. Earlier uploads each passed
        # CURRENT_PROJECT_VERSION on the xcodebuild command line and left this line reading "38",
        # so the file said 38 while the record was already at 40 — the next person to trust it
        # would have been rejected as a duplicate. The next manual upload must use 44 or higher.
        CURRENT_PROJECT_VERSION: "47"
        # iPhone only. Declaring iPad ("1,2") without UIRequiresFullScreen makes the app
        # multitasking-capable, which Apple then requires to support ALL FOUR orientations —
        # otherwise App Store Connect rejects with ITMS-90474. The UI is a portrait phone
        # layout (App/BiyaherongApp.swift hosts BiyaherongPhoneRoot), so claiming iPad support
        # would be a lie. iPhone-only apps still install on iPad in compatibility mode.
        # To genuinely support iPad later: build an iPad layout, then set "1,2" AND list all
        # four orientations — do not reach for UIRequiresFullScreen, which Apple is retiring.
        TARGETED_DEVICE_FAMILY: "1"
        # Required, or App Store Connect rejects the upload for a missing CFBundleIconName.
        # The catalog itself MUST be committed to git — a build with this setting but no
        # catalog on disk still succeeds and silently ships with no icon keys at all.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # App/PrivacyInfo.xcprivacy needs no entry of its own: the `- path: App` source above
        # sweeps it, and XcodeGen files a non-compilable type into Copy Bundle Resources, which is
        # where Apple requires it. That is INFERENCE though, and the same paranoia the icon comment
        # above earned applies — after `xcodegen generate`, confirm the archive really contains
        # Biyaherong.app/PrivacyInfo.xcprivacy. No gate on Windows can see it.
        GENERATE_INFOPLIST_FILE: YES
        # The app makes no network calls of its own. TWO Apple frameworks talk to Apple on its
        # behalf — StoreKit for the subscription, which reads the device's own transaction cache,
        # and AuthenticationServices for Sign in with Apple. Both use OS-provided TLS, which is
        # EXEMPT, so `NO` remains the correct declaration and stops App Store Connect halting every
        # upload on the manual export-compliance question.
        #
        # AuthenticationServices is the newer of the two and it does change one thing that is NOT
        # an export question: the first sign-in needs a connection, so the app is no longer usable
        # from a cold install with no network. "Offline after sign-in" is the honest claim, and the
        # in-app privacy sheet was reworded to say exactly that.
        #
        # `tools/qa/replay_premium.js` and `replay_login.js` both fail the build gate on any
        # URLSession or extra URL — in the new login file too — so this claim stays a test rather
        # than a comment.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Biyaherong
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # (An INFOPLIST_KEY_..._~ipad line used to live here. Xcode's INFOPLIST_KEY_ mechanism
        # uses an _iPad suffix, not the plist-style ~ipad, so it was silently dropped — verified
        # absent from the real archive's Info.plist. Moot now that the app is iPhone-only.)
        SWIFT_VERSION: "6.0"
        # MANUAL signing, and these four lines must stay TARGET-scoped. Passing them as
        # `xcodebuild` command-line overrides applies them to EVERY target, including SwiftPM's
        # generated resource bundle `BiyaherongUI_BiyaherongUI`, which then fails with "does not
        # support provisioning profiles, but provisioning profile ... has been manually specified".
        #
        # Builds 38-42 dodged this by archiving with CODE_SIGNING_ALLOWED=NO and letting
        # `-exportArchive` sign from ExportOptions.plist. That trick works ONLY for an app with no
        # entitlements. Verified 2026-08-18: an unsigned archive never runs ProcessProductPackaging,
        # produces no .xcent, and export then signs with the profile's baseline entitlements only —
        # `com.apple.developer.applesignin` is silently dropped and the login dies at runtime. Now
        # that the app HAS an entitlement, the archive itself must be signed.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 3C29G97AU5
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Biyaherong App Store"
        # Sign in with Apple. The button was a fake until now — it called no
        # AuthenticationServices API at all, which PORTING_NOTES.md already recorded as an App
        # Store rejection — and DemoApp/Sources/BiyaherongUI/LoginAppleAuth.swift is the real call.
        #
        # This setting is only one of THREE things that must be true. The other two are outside
        # this repo: the capability must be enabled for this App ID in the Apple Developer portal
        # (otherwise signing fails), and the build must actually be signed — codemagic.yaml's
        # `ios-free-unsigned` workflow archives with CODE_SIGNING_ALLOWED=NO, so entitlements are
        # never applied there and the sign-in cannot work in that .ipa. Use `ios-testflight`.
        CODE_SIGN_ENTITLEMENTS: Biyaherong.entitlements

# A SHARED scheme must exist on disk. Xcode silently auto-creates one when you open the
# project locally, but a headless `xcodebuild -scheme Biyaherong` (Codemagic) fails with
# "scheme not found" without this block.
schemes:
  Biyaherong:
    build:
      targets:
        Biyaherong: all
    run:
      config: Debug
      # Without this the Debug scheme talks to the real sandbox, which needs an App Store Connect
      # record and a sandbox Apple Account. With it, everything is local and instant.
      storeKitConfiguration: Biyaherong.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

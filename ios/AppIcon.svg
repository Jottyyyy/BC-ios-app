<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Biyaherong Chess Coach — the ORIGINAL app icon source art (1024x1024). HISTORICAL.

  ⚠ DO NOT regenerate the shipped icon from this file. The command that used to live here —
      rsvg-convert -w 1024 -h 1024 ios/AppIcon.svg -o ios/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png
  would silently revert an App Store fix. The catalog icon has moved twice since:

    2026-08-19  the client replaced this gold knight with their brand collage, because Apple's own
                Sign in with Apple sheet draws the app icon and they wanted the mark to appear there.
    2026-09-16  Apple rejected 1.0.8 (56) under Guideline 5.2.5 — that collage contained a
                smartphone with a notch and an iOS status bar. The shipped icon is now a blue chess
                knight with a contrail, supplied by the client, and it is a raster with no source
                in this repo.

  This file is kept because it documents the palette and the geometry, and because the render of it
  still lives at DemoApp/Sources/BiyaherongUI/Images/app-icon.png as the browser's 404 fallback.
  `tools/qa/home_chrome_check.js` asserts that fallback is a DIFFERENT picture from the shipped
  icon, so regenerating over the catalog would fail the gate as well as the review.

  Palette is taken straight from Theme.swift so the icon matches the app:
      background #0F1A2E · card #1A2942 · gold #FDB022 · boardDark #2C4A73
  Knight outline derives from the same Creative Commons piece art used on the board
  (Chess_nlt45.svg, Uray M. Janos) so the icon and the board read as one system.
  Full-bleed square with no transparency and no rounded corners — iOS applies its own mask.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1B3054"/>
      <stop offset="55%"  stop-color="#0F1A2E"/>
      <stop offset="100%" stop-color="#0B1424"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%"   stop-color="#FDB022" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#FDB022" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FDB022" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD36B"/>
      <stop offset="48%"  stop-color="#FDB022"/>
      <stop offset="100%" stop-color="#E08A08"/>
    </linearGradient>

    <!-- Faint board texture, clipped to the lower corners so it grounds the mark without competing. -->
    <pattern id="checker" width="128" height="128" patternUnits="userSpaceOnUse">
      <rect width="64"  height="64" x="0"  y="0"  fill="#FFFFFF" fill-opacity="0.030"/>
      <rect width="64"  height="64" x="64" y="64" fill="#FFFFFF" fill-opacity="0.030"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#checker)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Knight, scaled from the 45x45 piece grid: translate(116,106) scale(18) -->
  <g transform="translate(116,106) scale(18)">
    <!-- soft contact shadow so the gold lifts off the navy -->
    <g fill="#000000" opacity="0.28" transform="translate(0.35,0.55)">
      <path d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 25,32.5 23,18"/>
      <path d="M 24,18 C 24.38,20.91 18.45,25.37 16,27 C 13,29 13.18,31.34 11,31 C 9.958,30.06 12.41,27.96 11,28 C 10,28 11.19,29.23 10,30 C 9,30 5.997,31 6,26 C 6,24 12,14 12,14 C 12,14 13.89,12.1 14,10.5 C 13.27,9.506 13.5,8.5 13.5,7.5 C 14.5,6.5 16.5,10 16.5,10 L 18.5,10 C 18.5,10 19.28,8.008 21,7 C 22,7 22,10 22,10"/>
    </g>

    <!-- the mark itself -->
    <g fill="url(#goldFill)" stroke="#7A4A05" stroke-width="0.6"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 25,32.5 23,18"/>
      <path d="M 24,18 C 24.38,20.91 18.45,25.37 16,27 C 13,29 13.18,31.34 11,31 C 9.958,30.06 12.41,27.96 11,28 C 10,28 11.19,29.23 10,30 C 9,30 5.997,31 6,26 C 6,24 12,14 12,14 C 12,14 13.89,12.1 14,10.5 C 13.27,9.506 13.5,8.5 13.5,7.5 C 14.5,6.5 16.5,10 16.5,10 L 18.5,10 C 18.5,10 19.28,8.008 21,7 C 22,7 22,10 22,10"/>
    </g>

    <!-- eye + muzzle punched back out in the navy so the silhouette keeps its character -->
    <g fill="#0F1A2E" stroke="#0F1A2E" stroke-width="0.8" stroke-linejoin="round">
      <path d="M 9.5,25.5 A 0.5,0.5,0 1,1 8.5,25.5 A 0.5,0.5,0 1,1 9.5,25.5 Z"/>
      <path d="M 15.25,14.2 A 0.5,1.5,30 1,1 13.75,16.8 A 0.5,1.5,30 1,1 15.25,14.2 Z"/>
    </g>
  </g>
</svg>
